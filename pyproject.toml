[project]
name = "crimebase"
version = "0.1.0"
description = "Crime classification on the Kaggle CrimeBase dataset: cleaning, XGBoost, and model comparison."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "catboost>=1.2.7",
    "optuna>=4.0",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "threadpoolctl>=3.5",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crimebase"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
